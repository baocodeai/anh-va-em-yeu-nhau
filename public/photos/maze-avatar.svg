<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mazeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <filter id="mazeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#1c0f1d" stroke="url(#mazeGrad)" stroke-width="4" filter="url(#mazeGlow)"/>
  <!-- Girl Head / Hair -->
  <circle cx="100" cy="85" r="42" fill="#2d1222" stroke="#fb7185" stroke-width="2"/>
  <!-- Flowing Hair -->
  <path d="M 60 85 C 55 125 70 145 75 160 C 85 140 70 110 70 95 Z" fill="#f43f5e" opacity="0.8"/>
  <path d="M 140 85 C 145 125 130 145 125 160 C 115 140 130 110 130 95 Z" fill="#f43f5e" opacity="0.8"/>
  <circle cx="100" cy="80" r="28" fill="#ffe4e6"/>
  <!-- Gentle closed eyes and blushing smile -->
  <path d="M 88 80 Q 92 84 96 80" stroke="#881337" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 104 80 Q 108 84 112 80" stroke="#881337" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Blushing cheeks -->
  <circle cx="85" cy="85" r="4" fill="#fb7185" opacity="0.6"/>
  <circle cx="115" cy="85" r="4" fill="#fb7185" opacity="0.6"/>
  <!-- Sweet Smile -->
  <path d="M 96 88 Q 100 93 104 88" stroke="#be123c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Star hairpin -->
  <polygon points="120,60 123,67 130,68 125,73 126,80 120,76 114,80 115,73 110,68 117,67" fill="#fbbf24"/>
  <!-- Dress/Shoulders -->
  <path d="M 50 170 C 50 135 72 125 100 125 C 128 125 150 135 150 170 Z" fill="#4c0519" stroke="#fb7185" stroke-width="2"/>
  <!-- Heart Emblem -->
  <path d="M 100 142 C 100 142 93 135 87 139 C 81 143 83 151 100 162 C 117 151 119 143 113 139 C 107 135 100 142 100 142 Z" fill="#f43f5e"/>
  <!-- Name badge -->
  <rect x="70" y="172" width="60" height="20" rx="6" fill="#9f1239"/>
  <text x="100" y="186" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Maze 🌸</text>
</svg>
