<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a044e"/>
      <stop offset="35%" stop-color="#9d174d"/>
      <stop offset="65%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="30%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="260" fill="url(#sunsetSky)"/>
  <!-- Sun -->
  <circle cx="300" cy="240" r="70" fill="#fef08a" opacity="0.95"/>
  <!-- Sea -->
  <rect y="250" width="600" height="150" fill="url(#seaGrad)"/>
  <!-- Sun reflection on water -->
  <ellipse cx="300" cy="270" rx="60" ry="8" fill="#fef08a" opacity="0.6"/>
  <ellipse cx="300" cy="290" rx="45" ry="6" fill="#fef08a" opacity="0.4"/>
  <ellipse cx="300" cy="315" rx="30" ry="5" fill="#fef08a" opacity="0.3"/>
  <ellipse cx="300" cy="340" rx="15" ry="4" fill="#fef08a" opacity="0.2"/>
  <!-- Couple silhouette on shore -->
  <ellipse cx="285" cy="250" rx="8" ry="12" fill="#18181b"/>
  <ellipse cx="315" cy="253" rx="7" ry="10" fill="#18181b"/>
  <path d="M 275 310 C 275 270 280 260 285 260 C 290 260 295 270 295 310 Z" fill="#18181b"/>
  <path d="M 305 310 C 305 270 310 262 315 262 C 320 262 325 270 325 310 Z" fill="#18181b"/>
  <!-- Holding hands line -->
  <line x1="290" y1="280" x2="310" y2="280" stroke="#18181b" stroke-width="4"/>
  <!-- Romantic text caption -->
  <rect x="180" y="350" width="240" height="32" rx="16" fill="#000000" opacity="0.6"/>
  <text x="300" y="371" fill="#fef08a" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" text-anchor="middle">AI &amp; Maze — Hoàng Hôn Biển 🌊</text>
</svg>
