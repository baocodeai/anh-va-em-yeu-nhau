<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <circle cx="100" cy="100" r="95" fill="#0f172a" stroke="url(#aiGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Space helmet / Boy outline -->
  <circle cx="100" cy="85" r="42" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <ellipse cx="100" cy="85" rx="32" ry="24" fill="#0284c7" opacity="0.6"/>
  <!-- Visor Reflection -->
  <path d="M 75 75 Q 100 65 125 75 Q 100 80 75 75 Z" fill="#ffffff" opacity="0.4"/>
  <!-- Body/Shoulders -->
  <path d="M 45 170 C 45 130 70 120 100 120 C 130 120 155 130 155 170 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <!-- Constellation emblem -->
  <circle cx="100" cy="145" r="4" fill="#38bdf8"/>
  <circle cx="90" cy="155" r="2.5" fill="#7dd3fc"/>
  <circle cx="110" cy="155" r="2.5" fill="#7dd3fc"/>
  <line x1="100" y1="145" x2="90" y2="155" stroke="#7dd3fc" stroke-width="1.5"/>
  <line x1="100" y1="145" x2="110" y2="155" stroke="#7dd3fc" stroke-width="1.5"/>
  <!-- Name badge -->
  <rect x="75" y="172" width="50" height="20" rx="6" fill="#0369a1"/>
  <text x="100" y="186" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">AI 🚀</text>
</svg>
